<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, initial-scale=1.0">
  <title>Radical 6 — The Pass</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sil-dark: #1a1a2e;
      --sil-mid: #2d2d44;
      --ui-fg: rgba(255,255,255,0.92);
      --ui-dim: rgba(255,255,255,0.55);
      --ui-bg: rgba(26,26,46,0.45);
      --lantern-green: #6ecf8a;
      --lantern-amber: #e8b84a;
      --lantern-dim: #4a4a5a;
      --combo-gold: #ffd166;
      --pass-flash: #fff8e8;
    }

    body {
      font-family: 'Nunito', system-ui, sans-serif;
      background: #0b1033;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .wireframe {
      width: 1280px;
      height: 800px;
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.55);
      cursor: grab;
      user-select: none;
      touch-action: none;
    }
    .wireframe.dragging { cursor: grabbing; }

    /* ── Sky layers (cross-fade via JS) ── */
    .sky {
      position: absolute;
      inset: 0;
      transition: opacity 1.2s ease;
    }
    .sky-dawn   { background: linear-gradient(180deg, #4a3a6e 0%, #e8a38a 85%); opacity: 0; }
    .sky-day    { background: linear-gradient(180deg, #6fb8e8 0%, #b8d8ee 80%); opacity: 0; }
    .sky-dusk   { background: linear-gradient(180deg, #3d2a5a 0%, #e8856e 82%); opacity: 0; }
    .sky-night  { background: linear-gradient(180deg, #0b1033 0%, #3a2f5a 75%); opacity: 0; }

    .aurora {
      position: absolute;
      top: 8%;
      left: 0;
      right: 0;
      height: 120px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1s ease;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(110,207,138,0.15) 20%,
        rgba(120,180,255,0.25) 40%,
        rgba(180,120,255,0.2) 60%,
        rgba(110,207,138,0.15) 80%,
        transparent 100%);
      filter: blur(20px);
      z-index: 2;
    }
    .aurora.on { opacity: 1; }

    #snow-canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 30;
    }

    /* ── Parallax layers ── */
    .layer {
      position: absolute;
      left: 0;
      right: 0;
      will-change: transform;
    }

    .layer-mountains {
      bottom: 280px;
      height: 200px;
      z-index: 3;
    }
    .layer-mid {
      bottom: 160px;
      height: 260px;
      z-index: 5;
    }
    .layer-trees {
      bottom: 100px;
      height: 180px;
      z-index: 8;
    }
    .layer-ground {
      bottom: 0;
      height: 220px;
      z-index: 10;
    }

    .mountain-strip {
      position: absolute;
      bottom: 0;
      width: 4000px;
      height: 100%;
    }
    .mountain-strip svg { display: block; height: 100%; width: 100%; }

    .hill-strip {
      position: absolute;
      bottom: 0;
      width: 5000px;
      height: 100%;
    }

    .tree-strip {
      position: absolute;
      bottom: 0;
      width: 4500px;
      height: 100%;
    }

    .slope-strip {
      position: absolute;
      bottom: 0;
      width: 6000px;
      height: 100%;
    }

    /* ── Landmarks ── */
    .landmark {
      position: absolute;
      bottom: 40px;
      transform: translateX(-50%);
      z-index: 6;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .landmark:hover { transform: translateX(-50%) scale(1.04); }
    .landmark svg { display: block; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.25)); }

    .landmark-chip {
      position: absolute;
      top: -28px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--ui-fg);
      background: var(--ui-bg);
      padding: 3px 8px;
      border-radius: 4px;
      white-space: nowrap;
      backdrop-filter: blur(6px);
    }

    .lantern {
      position: absolute;
      top: -12px;
      right: -8px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      box-shadow: 0 0 8px currentColor;
    }
    .lantern.awake  { background: var(--lantern-green); color: var(--lantern-green); }
    .lantern.winding { background: var(--lantern-amber); color: var(--lantern-amber); }
    .lantern.sleep  { background: var(--lantern-dim); color: var(--lantern-dim); box-shadow: none; }

    /* ── Rider ── */
    .rider-wrap {
      position: absolute;
      bottom: 118px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      pointer-events: none;
    }
    .rider {
      position: relative;
      width: 48px;
      height: 56px;
      transition: transform 0.05s linear;
    }
    .rider.jumping {
      animation: jump-arc 0.65s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }
    .rider.grinding {
      animation: grind-pose 0.8s ease forwards;
    }
    @keyframes jump-arc {
      0%   { transform: translateY(0) rotate(0deg); }
      35%  { transform: translateY(-72px) rotate(-18deg); }
      70%  { transform: translateY(-28px) rotate(8deg); }
      100% { transform: translateY(0) rotate(0deg); }
    }
    @keyframes grind-pose {
      0%   { transform: translateY(-20px) rotate(-35deg) scaleX(1.1); }
      50%  { transform: translateY(-8px) rotate(-42deg) scaleX(1.15); }
      100% { transform: translateY(0) rotate(-5deg) scaleX(1); }
    }
    .rider svg { display: block; width: 100%; height: 100%; }

    /* ── Birds ── */
    .bird {
      position: absolute;
      z-index: 14;
      pointer-events: none;
      opacity: 0.85;
    }
    .bird svg { width: 28px; height: 16px; }

    /* ── PASS flash ── */
    .pass-flash {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      font-family: 'Nunito', sans-serif;
      font-size: 3.5rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--pass-flash);
      text-shadow: 0 2px 24px rgba(255,255,255,0.4);
      opacity: 0;
      pointer-events: none;
      z-index: 25;
    }
    .pass-flash.show {
      animation: pass-pop 0.9s ease forwards;
    }
    @keyframes pass-pop {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      25%  { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
      70%  { opacity: 0.85; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -60%) scale(0.9); }
    }

    /* ── Combo badge ── */
    .combo-badge {
      position: absolute;
      top: 88px;
      right: 24px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--combo-gold);
      background: rgba(26,26,46,0.6);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,209,102,0.35);
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 0.25s, transform 0.25s;
      z-index: 40;
      backdrop-filter: blur(8px);
    }
    .combo-badge.on {
      opacity: 1;
      transform: scale(1);
    }

    /* ── Chrome ── */
    .chrome {
      position: absolute;
      z-index: 50;
      pointer-events: none;
    }
    .chrome > * { pointer-events: auto; }

    .brand {
      top: 16px;
      left: 20px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ui-fg);
      text-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    .settings-dot {
      top: 18px;
      right: 20px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--ui-bg);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: default;
    }
    .settings-dot::after {
      content: '';
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--ui-fg);
      box-shadow: -6px 0 0 var(--ui-fg), 6px 0 0 var(--ui-fg);
    }

    .proto-badge {
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ui-dim);
      background: var(--ui-bg);
      padding: 5px 12px;
      border-radius: 4px;
      backdrop-filter: blur(6px);
      white-space: nowrap;
    }

    /* ── Annotations ── */
    .anno {
      position: absolute;
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ui-fg);
      background: var(--ui-bg);
      padding: 6px 10px;
      border-radius: 6px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      z-index: 45;
      max-width: 160px;
      line-height: 1.35;
      pointer-events: none;
    }
    .anno-1 { top: 56px; left: 20px; }
    .anno-2 { top: 130px; right: 20px; }
    .anno-3 { bottom: 100px; left: 20px; }
    .anno-4 { bottom: 100px; right: 20px; }

    /* ── Scrub bar ── */
    .scrub-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 52px;
      background: linear-gradient(transparent, rgba(11,16,51,0.75));
      z-index: 50;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 24px 12px;
      pointer-events: none;
    }
    .scrub-bar > * { pointer-events: auto; }

    .scrub-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.04em;
      color: var(--ui-dim);
    }
    .scrub-time {
      font-size: 0.78rem;
      color: var(--ui-fg);
      font-weight: 500;
    }
    .scrub-offset { color: var(--ui-dim); }

    .scrub-track-wrap {
      position: relative;
      height: 6px;
    }
    .scrub-golden {
      position: absolute;
      top: 0;
      height: 100%;
      background: rgba(255,209,102,0.35);
      border-radius: 3px;
      pointer-events: none;
    }
    .scrub-track {
      width: 100%;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255,255,255,0.15);
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }
    .scrub-track::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--ui-fg);
      box-shadow: 0 0 8px rgba(255,255,255,0.4);
      cursor: grab;
    }
    .scrub-track::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--ui-fg);
      border: none;
      cursor: grab;
    }

    /* ── Detail panel ── */
    .detail-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(26,26,46,0.92);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255,255,255,0.12);
      padding: 20px 28px 28px;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
      z-index: 60;
    }
    .detail-panel.open { transform: translateY(0); }

    .detail-close {
      position: absolute;
      top: 12px;
      right: 16px;
      background: none;
      border: none;
      color: var(--ui-dim);
      font-size: 1.2rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px 8px;
    }
    .detail-close:hover { color: var(--ui-fg); }

    .detail-city {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--ui-fg);
      margin-bottom: 4px;
    }
    .detail-iana {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--ui-dim);
      margin-bottom: 12px;
    }
    .detail-row {
      display: flex;
      gap: 24px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--ui-fg);
    }
    .detail-row span { color: var(--ui-dim); }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      .sky { transition: none; }
      .aurora { transition: none; }
      .layer { transition: none !important; }
      .rider.jumping, .rider.grinding { animation: none; }
      .pass-flash.show { animation: none; opacity: 1; }
      .combo-badge { transition: none; }
      .detail-panel { transition: none; }
      #snow-canvas { display: none; }
      .bird { display: none; }
    }
  </style>
</head>
<body>
  <div class="wireframe" id="wireframe" role="application" aria-label="The Pass — Alto-inspired timezone ride prototype">
    <!-- Sky -->
    <div class="sky sky-dawn" id="sky-dawn"></div>
    <div class="sky sky-day" id="sky-day"></div>
    <div class="sky sky-dusk" id="sky-dusk"></div>
    <div class="sky sky-night" id="sky-night"></div>
    <div class="aurora" id="aurora" aria-hidden="true"></div>

    <!-- Far mountains 0.2x -->
    <div class="layer layer-mountains" id="layer-mountains">
      <div class="mountain-strip" id="mountains-a">
        <svg viewBox="0 0 2000 200" preserveAspectRatio="none" aria-hidden="true">
          <path fill="#2d2d44" d="M0,200 L0,120 L120,60 L240,110 L380,40 L520,100 L660,55 L800,95 L960,35 L1100,90 L1240,50 L1380,105 L1520,45 L1660,100 L1800,60 L2000,110 L2000,200 Z"/>
          <path fill="#1a1a2e" d="M0,200 L0,150 L200,100 L400,140 L600,90 L800,130 L1000,80 L1200,125 L1400,85 L1600,120 L1800,95 L2000,135 L2000,200 Z" opacity="0.6"/>
        </svg>
      </div>
      <div class="mountain-strip" id="mountains-b" style="left:2000px">
        <svg viewBox="0 0 2000 200" preserveAspectRatio="none" aria-hidden="true">
          <path fill="#2d2d44" d="M0,200 L0,130 L150,70 L300,120 L450,45 L600,105 L750,60 L900,100 L1050,50 L1200,95 L1350,55 L1500,110 L1650,65 L1800,105 L2000,115 L2000,200 Z"/>
        </svg>
      </div>
    </div>

    <!-- Mid hills + landmarks 0.5x -->
    <div class="layer layer-mid" id="layer-mid">
      <div class="hill-strip" id="hills-a">
        <svg viewBox="0 0 2500 260" preserveAspectRatio="none" aria-hidden="true">
          <path fill="#2d2d44" d="M0,260 L0,180 L300,140 L600,190 L900,130 L1200,175 L1500,120 L1800,170 L2100,135 L2500,185 L2500,260 Z"/>
        </svg>
      </div>
      <div id="landmarks-container"></div>
    </div>

    <!-- Near trees 0.8x -->
    <div class="layer layer-trees" id="layer-trees">
      <div class="tree-strip" id="trees-a">
        <svg viewBox="0 0 2250 180" preserveAspectRatio="none" aria-hidden="true">
          <g fill="#1a1a2e">
            <polygon points="80,180 100,120 120,180"/><polygon points="200,180 225,100 250,180"/>
            <polygon points="420,180 445,110 470,180"/><polygon points="580,180 600,130 620,180"/>
            <polygon points="780,180 810,95 840,180"/><polygon points="950,180 970,125 990,180"/>
            <polygon points="1150,180 1180,105 1210,180"/><polygon points="1320,180 1340,135 1360,180"/>
            <polygon points="1520,180 1550,90 1580,180"/><polygon points="1700,180 1720,120 1740,180"/>
            <polygon points="1900,180 1930,100 1960,180"/><polygon points="2080,180 2100,140 2120,180"/>
          </g>
        </svg>
      </div>
    </div>

    <!-- Ground + slope 1.0x -->
    <div class="layer layer-ground" id="layer-ground">
      <div class="slope-strip" id="slope-a">
        <svg viewBox="0 0 3000 220" preserveAspectRatio="none" aria-hidden="true">
          <path fill="#1a1a2e" d="M0,220 L0,160 Q500,140 1000,155 T2000,145 T3000,150 L3000,220 Z"/>
          <path fill="#2d2d44" d="M0,220 L0,175 Q750,160 1500,168 T3000,162 L3000,220 Z" opacity="0.5"/>
        </svg>
      </div>
    </div>

    <!-- Rider -->
    <div class="rider-wrap" id="rider-wrap">
      <div class="rider" id="rider" aria-hidden="true">
        <svg viewBox="0 0 48 56" aria-hidden="true">
          <ellipse cx="24" cy="8" rx="7" ry="8" fill="#1a1a2e"/>
          <path fill="#2d2d44" d="M16,16 Q24,14 32,16 L34,28 L30,32 L18,32 L14,28 Z"/>
          <path fill="#1a1a2e" d="M8,32 L40,34 L42,38 L6,36 Z"/>
          <rect x="10" y="36" width="6" height="14" rx="2" fill="#2d2d44"/>
          <rect x="32" y="36" width="6" height="14" rx="2" fill="#2d2d44"/>
          <path fill="#1a1a2e" d="M4,38 Q24,42 44,38 L46,42 Q24,48 2,42 Z"/>
        </svg>
      </div>
    </div>

    <!-- Birds -->
    <div class="bird" id="bird-0" aria-hidden="true">
      <svg viewBox="0 0 28 16"><path fill="#2d2d44" d="M2,8 Q7,2 14,8 Q21,2 26,8 Q21,10 14,8 Q7,10 2,8 Z"/></svg>
    </div>
    <div class="bird" id="bird-1" aria-hidden="true">
      <svg viewBox="0 0 28 16"><path fill="#2d2d44" d="M2,8 Q7,2 14,8 Q21,2 26,8 Q21,10 14,8 Q7,10 2,8 Z"/></svg>
    </div>
    <div class="bird" id="bird-2" aria-hidden="true">
      <svg viewBox="0 0 28 16"><path fill="#1a1a2e" d="M2,8 Q7,2 14,8 Q21,2 26,8 Q21,10 14,8 Q7,10 2,8 Z"/></svg>
    </div>

    <canvas id="snow-canvas" aria-hidden="true"></canvas>

    <div class="pass-flash" id="pass-flash" aria-live="polite">PASS</div>
    <div class="combo-badge" id="combo-badge" aria-live="polite"></div>

    <!-- Chrome -->
    <div class="chrome brand">And the time is</div>
    <div class="chrome proto-badge">Radical 6 — The Pass · Alto-inspired prototype</div>
    <div class="chrome settings-dot" aria-label="Settings" role="img"></div>

    <div class="anno anno-1">Drag slope or scrub bar — ride through the day</div>
    <div class="anno anno-2">Space / tap — jump &amp; grind tricks</div>
    <div class="anno anno-3">Bird companions follow your line</div>
    <div class="anno anno-4">Aurora when 3+ cities awake</div>

    <div class="scrub-bar">
      <div class="scrub-meta">
        <span class="scrub-time" id="scrub-time">14:00 NYC</span>
        <span class="scrub-offset" id="scrub-offset">+0m from now</span>
      </div>
      <div class="scrub-track-wrap">
        <div class="scrub-golden" id="scrub-golden"></div>
        <input type="range" class="scrub-track" id="scrub-slider"
          min="-720" max="720" value="0" step="5"
          aria-label="Scrub displayed time ±12 hours">
      </div>
    </div>

    <div class="detail-panel" id="detail-panel" role="dialog" aria-labelledby="detail-city" aria-hidden="true">
      <button class="detail-close" id="detail-close" aria-label="Close detail panel">&times;</button>
      <div class="detail-city" id="detail-city">—</div>
      <div class="detail-iana" id="detail-iana">—</div>
      <div class="detail-row">
        <div><span>Time </span><strong id="detail-time">—</strong></div>
        <div><span>Sky </span><strong id="detail-sky">—</strong></div>
        <div><span>State </span><strong id="detail-state">—</strong></div>
      </div>
    </div>
  </div>

  <script>
(function () {
  'use strict';

  const BASE_NYC_HOUR = 14;
  const SCRUB_MIN = -720;
  const SCRUB_MAX = 720;
  const MAX_WORLD_SCROLL = 3200;
  const LOCAL_IANA = 'America/New_York';
  const GOLDEN_START = 14;
  const GOLDEN_END = 18;
  const GRIND_RADIUS = 120;

  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const LANDMARKS = [
    {
      id: 'nyc', city: 'New York', iana: 'America/New_York', scrollX: 1340,
      svg: '<svg width="72" height="80" viewBox="0 0 72 80"><path fill="#1a1a2e" d="M8,80 L8,45 L16,45 L16,35 L24,35 L24,45 L32,45 L32,30 L40,30 L40,45 L48,45 L48,38 L56,38 L56,45 L64,45 L64,80 Z"/><path fill="#2d2d44" d="M0,80 L72,80 L72,50 Q36,42 0,50 Z"/></svg>'
    },
    {
      id: 'utc', city: 'UTC', iana: 'Etc/UTC', scrollX: 1640,
      svg: '<svg width="56" height="88" viewBox="0 0 56 88"><rect x="20" y="10" width="16" height="58" fill="#1a1a2e"/><circle cx="28" cy="8" r="8" fill="#2d2d44"/><path fill="#2d2d44" d="M12,68 L44,68 L40,80 L16,80 Z"/><line x1="28" y1="25" x2="28" y2="55" stroke="#2d2d44" stroke-width="2"/><line x1="28" y1="40" x2="36" y2="40" stroke="#2d2d44" stroke-width="2"/></svg>'
    },
    {
      id: 'tokyo', city: 'Tokyo', iana: 'Asia/Tokyo', scrollX: 1940,
      svg: '<svg width="64" height="90" viewBox="0 0 64 90"><path fill="#1a1a2e" d="M32,8 L48,35 L48,80 L16,80 L16,35 Z"/><path fill="#2d2d44" d="M32,18 L40,35 L40,45 L24,45 L24,35 Z"/><rect x="28" y="50" width="8" height="30" fill="#2d2d44"/></svg>'
    },
    {
      id: 'london', city: 'London', iana: 'Europe/London', scrollX: 2240,
      svg: '<svg width="52" height="96" viewBox="0 0 52 96"><rect x="18" y="30" width="16" height="66" fill="#1a1a2e"/><path fill="#2d2d44" d="M14,30 L38,30 L36,20 L16,20 Z"/><rect x="22" y="8" width="8" height="14" fill="#1a1a2e"/><circle cx="26" cy="50" r="6" fill="#2d2d44"/></svg>'
    },
    {
      id: 'berlin', city: 'Berlin', iana: 'Europe/Berlin', scrollX: 2540,
      svg: '<svg width="70" height="88" viewBox="0 0 70 88"><path fill="#1a1a2e" d="M35,5 L55,25 L55,80 L15,80 L15,25 Z"/><circle cx="35" cy="35" r="12" fill="#2d2d44"/><rect x="30" y="55" width="10" height="25" fill="#2d2d44"/></svg>'
    },
    {
      id: 'sydney', city: 'Sydney', iana: 'Australia/Sydney', scrollX: 2840,
      svg: '<svg width="80" height="72" viewBox="0 0 80 72"><path fill="#1a1a2e" d="M5,72 L5,45 Q20,20 40,35 Q60,20 75,45 L75,72 Z"/><path fill="#2d2d44" d="M15,72 L15,50 Q30,35 40,48 Q50,35 65,50 L65,72 Z"/></svg>'
    }
  ];

  const wireframe = document.getElementById('wireframe');
  const slider = document.getElementById('scrub-slider');
  const scrubTime = document.getElementById('scrub-time');
  const scrubOffset = document.getElementById('scrub-offset');
  const scrubGolden = document.getElementById('scrub-golden');
  const rider = document.getElementById('rider');
  const passFlash = document.getElementById('pass-flash');
  const comboBadge = document.getElementById('combo-badge');
  const aurora = document.getElementById('aurora');
  const detailPanel = document.getElementById('detail-panel');
  const landmarksContainer = document.getElementById('landmarks-container');

  const layerEls = {
    mountains: document.getElementById('layer-mountains'),
    mid: document.getElementById('layer-mid'),
    trees: document.getElementById('layer-trees'),
    ground: document.getElementById('layer-ground')
  };

  const parallaxFactors = { mountains: 0.2, mid: 0.5, trees: 0.8, ground: 1.0 };

  let scrubMinutes = 0;
  let worldScroll = 0;
  let isDragging = false;
  let dragStartX = 0;
  let dragStartScroll = 0;
  let isJumping = false;
  let jumpChain = 0;
  let jumpChainTimer = null;
  let birds = [
    { el: document.getElementById('bird-0'), x: 580, y: 280, lag: 0.04 },
    { el: document.getElementById('bird-1'), x: 620, y: 250, lag: 0.06 },
    { el: document.getElementById('bird-2'), x: 560, y: 310, lag: 0.08 }
  ];
  let riderScreenX = 640;
  let riderScreenY = 520;
  let animFrame = null;

  /* ── Build landmarks ── */
  LANDMARKS.forEach(function (lm) {
    const el = document.createElement('div');
    el.className = 'landmark';
    el.dataset.id = lm.id;
    el.style.left = lm.scrollX + 'px';
    el.innerHTML = lm.svg +
      '<div class="landmark-chip" data-chip="' + lm.id + '">--:--</div>' +
      '<div class="lantern sleep" data-lantern="' + lm.id + '"></div>';
    el.addEventListener('click', function (e) {
      e.stopPropagation();
      openDetail(lm);
    });
    landmarksContainer.appendChild(el);
  });

  function getDisplayDate(scrubMin) {
    const now = new Date();
    const nycHour = parseInt(new Intl.DateTimeFormat('en-US', {
      timeZone: LOCAL_IANA, hour: 'numeric', hour12: false
    }).format(now), 10);
    const nycMinute = parseInt(new Intl.DateTimeFormat('en-US', {
      timeZone: LOCAL_IANA, minute: 'numeric'
    }).format(now), 10);
    const deltaToBase = (BASE_NYC_HOUR * 60) - (nycHour * 60 + nycMinute);
    return new Date(now.getTime() + (deltaToBase + scrubMin) * 60000);
  }

  function formatTime(iana, date) {
    return new Intl.DateTimeFormat('en-US', {
      timeZone: iana, hour: '2-digit', minute: '2-digit', hour12: false
    }).format(date);
  }

  function getHourInZone(iana, date) {
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone: iana, hour: 'numeric', hour12: false
    }).formatToParts(date);
    const h = parts.find(function (p) { return p.type === 'hour'; });
    return h ? parseInt(h.value, 10) : 0;
  }

  function lanternState(hour) {
    if (hour >= 7 && hour < 21) return 'awake';
    if (hour >= 6 && hour < 7 || hour >= 21 && hour < 22) return 'winding';
    return 'sleep';
  }

  function skyState(hour) {
    if (hour >= 5 && hour < 8) return 'dawn';
    if (hour >= 8 && hour < 17) return 'day';
    if (hour >= 17 && hour < 20) return 'dusk';
    return 'night';
  }

  function skyLabel(state) {
    return { dawn: 'Dawn', day: 'Day', dusk: 'Dusk', night: 'Night' }[state] || state;
  }

  function lerp(a, b, t) { return a + (b - a) * t; }

  function updateSky(hour) {
    const states = ['dawn', 'day', 'dusk', 'night'];
    const weights = { dawn: 0, day: 0, dusk: 0, night: 0 };

    if (hour >= 4 && hour < 9) {
      const t = (hour - 4) / 5;
      if (t < 0.5) { weights.night = 1 - t * 2; weights.dawn = t * 2; }
      else { weights.dawn = 1 - (t - 0.5) * 2; weights.day = (t - 0.5) * 2; }
    } else if (hour >= 9 && hour < 16) {
      weights.day = 1;
    } else if (hour >= 16 && hour < 21) {
      const t = (hour - 16) / 5;
      if (t < 0.5) { weights.day = 1 - t * 2; weights.dusk = t * 2; }
      else { weights.dusk = 1 - (t - 0.5) * 2; weights.night = (t - 0.5) * 2; }
    } else {
      weights.night = 1;
      if (hour >= 3 && hour < 5) {
        const t = (hour - 3) / 2;
        weights.night = 1 - t * 0.5;
        weights.dawn = t * 0.5;
      }
    }

    states.forEach(function (s) {
      const el = document.getElementById('sky-' + s);
      if (el) el.style.opacity = weights[s];
    });
  }

  function scrollFromScrub(min) {
    return ((min - SCRUB_MIN) / (SCRUB_MAX - SCRUB_MIN)) * MAX_WORLD_SCROLL;
  }

  function scrubFromScroll(scroll) {
    const t = scroll / MAX_WORLD_SCROLL;
    return SCRUB_MIN + t * (SCRUB_MAX - SCRUB_MIN);
  }

  function applyParallax(scroll) {
    Object.keys(parallaxFactors).forEach(function (key) {
      const offset = -scroll * parallaxFactors[key];
      layerEls[key].style.transform = reducedMotion
        ? 'translateX(' + (-scrubMinutes * 2) + 'px)'
        : 'translate3d(' + offset + 'px, 0, 0)';
    });
  }

  function formatOffset(min) {
    if (min === 0) return '+0m from now';
    const sign = min > 0 ? '+' : '';
    const h = Math.floor(Math.abs(min) / 60);
    const m = Math.abs(min) % 60;
    if (h === 0) return sign + min + 'm from now';
    return sign + (min > 0 ? h : -h) + 'h ' + (m ? m + 'm' : '') + ' from now';
  }

  function updateGoldenMarker() {
    const trackW = slider.parentElement.clientWidth;
    const total = SCRUB_MAX - SCRUB_MIN;
    const gStart = ((0) / total) * trackW;
    const gEnd = ((GOLDEN_END - BASE_NYC_HOUR) * 60 - SCRUB_MIN) / total * trackW;
    const gStartPx = ((GOLDEN_START - BASE_NYC_HOUR) * 60 - SCRUB_MIN) / total * trackW;
    scrubGolden.style.left = gStartPx + 'px';
    scrubGolden.style.width = Math.max(0, gEnd - gStartPx) + 'px';
  }

  function updateUI() {
    const date = getDisplayDate(scrubMinutes);
    const nycTime = formatTime(LOCAL_IANA, date);
    const nycHour = getHourInZone(LOCAL_IANA, date);

    scrubTime.textContent = nycTime + ' NYC';
    scrubOffset.textContent = formatOffset(scrubMinutes);
    slider.value = scrubMinutes;

    updateSky(nycHour);

    let awakeCount = 0;
    LANDMARKS.forEach(function (lm) {
      const chip = document.querySelector('[data-chip="' + lm.id + '"]');
      const lantern = document.querySelector('[data-lantern="' + lm.id + '"]');
      const t = formatTime(lm.iana, date);
      const h = getHourInZone(lm.iana, date);
      const state = lanternState(h);
      if (chip) chip.textContent = t;
      if (lantern) {
        lantern.className = 'lantern ' + state;
        if (state === 'awake') awakeCount++;
      }
    });

    aurora.classList.toggle('on', awakeCount >= 3);

    const inGolden = nycHour >= GOLDEN_START && nycHour < GOLDEN_END;
    if (inGolden && jumpChain >= 2) {
      comboBadge.textContent = '×' + Math.min(jumpChain, 3);
      comboBadge.classList.add('on');
    } else {
      comboBadge.classList.remove('on');
    }
  }

  function setScrub(min, fromScroll) {
    scrubMinutes = Math.max(SCRUB_MIN, Math.min(SCRUB_MAX, Math.round(min / 5) * 5));
    if (!fromScroll) {
      worldScroll = scrollFromScrub(scrubMinutes);
    }
    applyParallax(worldScroll);
    updateUI();
  }

  function openDetail(lm) {
    const date = getDisplayDate(scrubMinutes);
    const h = getHourInZone(lm.iana, date);
    const state = lanternState(h);
    document.getElementById('detail-city').textContent = lm.city;
    document.getElementById('detail-iana').textContent = lm.iana;
    document.getElementById('detail-time').textContent = formatTime(lm.iana, date);
    document.getElementById('detail-sky').textContent = skyLabel(skyState(h));
    document.getElementById('detail-state').textContent =
      state === 'awake' ? 'Awake' : state === 'winding' ? 'Winding down' : 'Sleeping';
    detailPanel.classList.add('open');
    detailPanel.setAttribute('aria-hidden', 'false');
  }

  function closeDetail() {
    detailPanel.classList.remove('open');
    detailPanel.setAttribute('aria-hidden', 'true');
  }

  document.getElementById('detail-close').addEventListener('click', closeDetail);

  function nearLondon() {
    const london = LANDMARKS.find(function (l) { return l.id === 'london'; });
    const londonScreen = london.scrollX - worldScroll * parallaxFactors.mid;
    return Math.abs(londonScreen - riderScreenX) < GRIND_RADIUS;
  }

  function doJump() {
    if (isJumping) return;
    isJumping = true;
    rider.classList.remove('grinding');
    rider.classList.add('jumping');

    const grind = nearLondon();
    if (grind) {
      setTimeout(function () {
        rider.classList.remove('jumping');
        rider.classList.add('grinding');
        passFlash.classList.remove('show');
        void passFlash.offsetWidth;
        passFlash.classList.add('show');
      }, 280);
    }

    jumpChain++;
    clearTimeout(jumpChainTimer);
    jumpChainTimer = setTimeout(function () { jumpChain = 0; updateUI(); }, 2000);

    setTimeout(function () {
      rider.classList.remove('jumping', 'grinding');
      isJumping = false;
      updateUI();
    }, grind ? 800 : 650);
  }

  slider.addEventListener('input', function () {
    setScrub(parseInt(slider.value, 10), false);
  });

  wireframe.addEventListener('pointerdown', function (e) {
    if (e.target.closest('.scrub-bar, .detail-panel, .landmark, .settings-dot')) return;
    isDragging = true;
    dragStartX = e.clientX;
    dragStartScroll = worldScroll;
    wireframe.classList.add('dragging');
    wireframe.setPointerCapture(e.pointerId);
  });

  wireframe.addEventListener('pointermove', function (e) {
    if (!isDragging) return;
    const dx = e.clientX - dragStartX;
    worldScroll = Math.max(0, Math.min(MAX_WORLD_SCROLL, dragStartScroll - dx));
    applyParallax(worldScroll);
    setScrub(scrubFromScroll(worldScroll), true);
  });

  wireframe.addEventListener('pointerup', function (e) {
    if (!isDragging) return;
    isDragging = false;
    wireframe.classList.remove('dragging');
    try { wireframe.releasePointerCapture(e.pointerId); } catch (_) { /* noop */ }
  });

  wireframe.addEventListener('click', function (e) {
    if (e.target.closest('.landmark, .scrub-bar, .detail-panel, .settings-dot')) return;
    doJump();
  });

  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space') {
      e.preventDefault();
      doJump();
    } else if (e.code === 'ArrowLeft') {
      e.preventDefault();
      setScrub(scrubMinutes - 15, false);
    } else if (e.code === 'ArrowRight') {
      e.preventDefault();
      setScrub(scrubMinutes + 15, false);
    } else if (e.code === 'Escape') {
      closeDetail();
    }
  });

  /* ── Birds follow rider ── */
  function animateBirds() {
    if (!reducedMotion) {
      birds.forEach(function (b, i) {
        const targetX = riderScreenX - 60 - i * 35;
        const targetY = riderScreenY - 240 - i * 25 + Math.sin(Date.now() / 400 + i) * 8;
        b.x = lerp(b.x, targetX, b.lag);
        b.y = lerp(b.y, targetY, b.lag);
        b.el.style.transform = 'translate(' + b.x + 'px, ' + b.y + 'px)';
      });
    }
    animFrame = requestAnimationFrame(animateBirds);
  }

  /* ── Snow particles ── */
  const snowCanvas = document.getElementById('snow-canvas');
  const snowCtx = snowCanvas.getContext('2d');
  let flakes = [];

  function initSnow() {
    snowCanvas.width = 1280;
    snowCanvas.height = 800;
    flakes = [];
    for (let i = 0; i < 80; i++) {
      flakes.push({
        x: Math.random() * 1280,
        y: Math.random() * 800,
        r: Math.random() * 2.5 + 0.5,
        speed: Math.random() * 0.8 + 0.3,
        drift: Math.random() * 0.4 - 0.2
      });
    }
  }

  function drawSnow() {
    if (reducedMotion) return;
    snowCtx.clearRect(0, 0, 1280, 800);
    snowCtx.fillStyle = 'rgba(255,255,255,0.55)';
    flakes.forEach(function (f) {
      f.y += f.speed;
      f.x += f.drift;
      if (f.y > 800) { f.y = -4; f.x = Math.random() * 1280; }
      if (f.x > 1280) f.x = 0;
      if (f.x < 0) f.x = 1280;
      snowCtx.beginPath();
      snowCtx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      snowCtx.fill();
    });
    requestAnimationFrame(drawSnow);
  }

  initSnow();
  if (!reducedMotion) drawSnow();
  animateBirds();
  updateGoldenMarker();
  setScrub(0, false);

  window.addEventListener('resize', updateGoldenMarker);
})();
  </script>
